      description: Guide for managing capabilities with capa CLI
      repo: infragate/capa@capabilities-manager
    id: capabilities-manager
    type: github
  - def:
      description: "Capify an existing project: discover skills/rules/hooks/MCP servers across all providers and synthesize capabilities.yaml"
      repo: infragate/capa@bootstrap
    id: bootstrap
    type: github
  - def:
      repo: github/awesome-copilot@git-commit
    id: git-commit
    type: github
  - def:
      repo: mattpocock/skills@grill-me
    id: grill-me
    type: github
  - def:
      repo: mattpocock/skills@grill-with-docs
    id: grill-with-docs
    type: github
  - def:
      repo: mattpocock/skills@grilling
    id: grilling
    type: github
  - def:
      repo: mattpocock/skills@to-tickets
    id: to-tickets
    type: github
  - def:
      repo: cli/cli@gh
    id: gh
    type: github
tools: []
