---
# yaml-language-server: $schema=https://raw.githubusercontent.com/infragate/capa/main/schema/capabilities.schema.json
agents:
  additional:
    - id: repository-context
      path: .config/capabilities/instructions/repository.md
      type: local
    - id: agent-skills
      path: .config/capabilities/instructions/agent-skills.md
      type: local
  base:
    path: template/.config/capabilities/instructions/project.md
    type: local
options:
  agentActivity: true
  requiresCommands:
    - cli: mise
      description: Dev tools, env vars, and tasks in one CLI
    - cli: hk
      description: Git hooks for linters and formatters
  toolExposure: search
plugins:
  - def:
      description: Matt Pocock's agent skills for real engineering (grilling,
        spec/ticket flows, TDD, code review, domain modelling and more).
      repo: mattpocock/skills
    id: mattpocock-skills
    type: github
  - def:
      description:
        Forces the laziest solution that works. YAGNI, stdlib first, one
        line over fifty.
      repo: DietrichGebert/ponytail
    id: ponytail
    type: github
  - def:
      description: Talk like caveman. Cut filler. Keep technical details explicit.
      repo: JuliusBrussee/caveman
    id: caveman
    type: github
  - def:
      description: Architecture analysis, code quality, and development workflow
        skills by Ovid
      repo: Ovid/paad::plugins/paad
    id: paad
    type: github
  - def:
      description:
        "Set up, run and fix MegaLinter on any repository: 100+ linters for
        69+ languages, 23+ formats and 21+ tooling formats, from CI or locally."
      repo: oxsecurity/megalinter
    id: megalinter
    type: github
providers:
  # keep-sorted start
  - antigravity
  - claude-code
  - codex
  - cursor
  - kiro-cli
  # keep-sorted end
rules:
  - def:
      repo: multica-ai/andrej-karpathy-skills::.cursor/rules/karpathy-guidelines.mdc
    description: Andrej Karpathy's Guidelines
    id: karpathy-guidelines
    type: github
  - description: Engineering workflow and change discipline
    id: engineering
    path: template/.config/capabilities/rules/engineering.md
    type: local
  - alwaysApply: true
    description: Branch naming and atomic Conventional Commits
    id: commits
    path: template/.config/capabilities/rules/commits.md
    type: local
  - alwaysApply: true
    description: Where to save AI-generated artifacts
    id: ai-artifacts
    path: template/.config/capabilities/rules/ai-artifacts.md
    type: local
servers:
  - def:
      args:
        - mcp
      cmd: hk
    description: hk gives coding agents a narrow, inspectable way to run project
      checks and fixes.
    id: hk
    type: mcp
  - def:
      args:
        - mcp
      cmd: mise
      env:
        MISE_EXPERIMENTAL: "1"
    description:
      The mise MCP server lets an AI assistant inspect a project's tools,
      tasks, environment, and configuration, and run mise tasks.
    id: mise
    type: mcp
skills:
  - def:
      content: |
        ---
        name: tag-message
        description: Draft a brief annotated SemVer tag message from commits since the previous release tag. Use when asked for a tag message; do not create a tag.
        ---

        # Tag message

        Find the nearest SemVer tag reachable from HEAD, including lightweight and
        annotated tags. Accept an optional `v` prefix and valid SemVer prerelease
        and build suffixes; exclude non-SemVer tags. A tag at HEAD is the previous
        tag and means there are no new commits. If several SemVer tags point to
        the nearest commit, use the highest SemVer precedence; if still ambiguous,
        ask which tag to use. Do not rely on tag creation dates or Git glob
        patterns as SemVer validation. If history or tags are incomplete, say so.

        Read commits in `<previous-tag>..HEAD` and inspect changes when commit
        messages are unclear. If no SemVer tag is reachable or the range has no
        commits, report that and stop. Otherwise, output only a clear one- or
        two-line annotation summarizing the most meaningful changes. Do not
        create, modify, or push tags.
    id: tag-message
    type: inline
  - def:
      description: Guide for managing capabilities with capa CLI
      repo: infragate/capa@capabilities-manager
    id: capabilities-manager
    type: github
  - def:
      description: "Capify an existing project: discover skills/rules/hooks/MCP
        servers across all providers and synthesize capabilities.yaml"
      repo: infragate/capa@bootstrap
    id: bootstrap
    type: github
  - def:
      repo: github/awesome-copilot@git-commit
    id: git-commit
    type: github
  - def:
      repo: cli/cli@gh
    id: gh
    type: github
  - def:
      repo: nullswan/atomic-commits@atomic-commits
    id: atomic-commits
    type: github
tools: []
