---
_exclude:
  # keep-sorted start
  - "*.py[co]"
  - "{% if ci != 'forgejo' %}.forgejo{% endif %}"
  - "{% if ci != 'github' %}.github{% endif %}"
  - "{% if ci != 'gitlab' %}.gitlab-ci.yml{% endif %}"
  - "{% if ci != 'gitlab' %}.gitlab{% endif %}"
  - "{% if not use_ai %}.agents/skills{% endif %}"
  - "{% if not use_ai %}.config/capabilities{% endif %}"
  - "{% if not use_ai %}AGENTS.md{% endif %}"
  - "{% if not use_ai %}CLAUDE.md{% endif %}"
  - "{% if not use_ai %}capabilities.yaml{% endif %}"
  - .DS_Store
  - .git
  - .svn
  - __pycache__
  - copier.yaml
  - copier.yml
  - megalinter-reports
  - ~*
  # keep-sorted end
_migrations:
  - command: mv -b .github/workflows/treefmt.yml .github/workflows/mise-check.yml
    version: v0.4.1
  - command: |
      mkdir -p .config
      mv -b cliff.toml .config/cliff.toml
      mv -b .cspell.json .config/cspell.json
      mv -b hk.pkl .config/hk.pkl
      mv -b .rumdl.toml .config/rumdl.toml
      mv -b .ryl.toml .config/ryl.toml
    version: v0.10.0
  - command: mv -b typos.toml .typos.toml
    version: v0.11.0
  - command: |
      mkdir -p .config
      mv -b .jscpd.json .config/jscpd.json
      mv -b .treefmt.toml .config/treefmt.toml
      rm -f  .github/workflows/cocogitto.yml
    version: v0.12.0
  - command: rm -f apm.yml apm.lock.yaml
    version: v0.13.0
  # This idempotent migration preserves either old AI opt-in on project updates.
  - command: |
      python - <<'PY'
      from pathlib import Path
      import yaml

      answers_path = Path("{{ _copier_conf.answers_file }}")
      if answers_path.exists():
          answers = yaml.safe_load(answers_path.read_text()) or {}
          if "use_agents" in answers or "use_skills" in answers:
              legacy_ai = any(
                  bool(answers.get(key, False))
                  for key in ("use_agents", "use_skills")
              )
              answers.setdefault("use_ai", legacy_ai)
              answers.pop("use_agents", None)
              answers.pop("use_skills", None)
              answers_path.write_text(yaml.safe_dump(answers, sort_keys=False))
      PY
    when: "{{ _stage == 'before' }}"
_min_copier_version: 9.3.0
_subdirectory: template
_tasks:
  - command: command -v mise > /dev/null 2>&1 && echo "✓ mise is installed" || echo "✗ mise not found! Please install from here - https://mise.jdx.dev/"
    when: "{{ _copier_operation == 'copy' }}"
  - command: uvx --from lic-cli lic
    when: "{{ _copier_operation == 'copy' }}"
  - command: mise generate install-script --localize --write
    when: "{{ ci != 'github' }}"
ci:
  choices:
    Forgejo CI: forgejo
    GitHub CI: github
    GitLab CI: gitlab
  default: github
  help: What Continuous Integration service do you want to use?
  type: str
project_name:
  help: Enter the name of your project.
  type: str
  validator: "{% if not project_name %} project_name must not be empty. {% elif not (project_name | regex_search('^[a-zA-Z][a-zA-Z0-9 ._-]*$')) %} project_name must start with a letter and contain only letters, digits, spaces, dots, hyphens, or underscores. {% endif %}"
use_ai:
  default: false
  help: Include Capa-managed agent instructions and skills?
  type: bool
use_taste_skill:
  default: false
  help: Use taste-skill?
  type: bool
  when: "{{ use_ai }}"
