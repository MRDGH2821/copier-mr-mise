---
_exclude:
  # keep-sorted start
  - "*.py[co]"
  - "{% if ci != 'forgejo' %}.forgejo{% endif %}"
  - "{% if ci != 'forgejo' %}.lycheeignore{% endif %}"
  - "{% if ci != 'github' %}.github{% endif %}"
  - "{% if ci != 'gitlab' %}.gitlab-ci.yml{% endif %}"
  - "{% if ci != 'gitlab' %}.gitlab{% endif %}"
  - "{% if not use_ai %}.agents/skills{% endif %}"
  - "{% if not use_ai %}.config/capabilities{% endif %}"
  - "{% if not use_ai %}AGENTS.md{% endif %}"
  - "{% if not use_ai %}CLAUDE.md{% endif %}"
  - "{% if not use_ai %}capabilities.yaml{% endif %}"
  - .DS_Store
  - .git
  - .svn
  - __pycache__
  - copier.yaml
  - copier.yml
  - megalinter-reports
  - ~*
  # keep-sorted end
_migrations:
  - command: |
      if [ -e .github/workflows/treefmt.yml ]; then
        mv -b .github/workflows/treefmt.yml .github/workflows/mise-check.yml
      fi
    version: v0.4.1
    when: "{{ _stage == 'before' }}"
  - command: mise exec aqua:owenlamont/ryl -- ryl --migrate-configs --migrate-write
    version: v0.10.0
    when: "{{ _stage == 'before' }}"
  - command: |
      set -e
      mkdir -p .config
      if [ -e cliff.toml ]; then mv -b cliff.toml .config/cliff.toml; fi
      if [ -e .cspell.json ]; then mv -b .cspell.json .config/cspell.json; fi
      if [ -e hk.pkl ]; then mv -b hk.pkl .config/hk.pkl; fi
      if [ -e .rumdl.toml ]; then mv -b .rumdl.toml .config/rumdl.toml; fi
      if [ -e .ryl.toml ]; then mv -b .ryl.toml .config/ryl.toml; fi
    version: v0.10.0
    when: "{{ _stage == 'before' }}"
  - command: |
      if [ -e .config/ryl.toml ]; then
        mv -b .config/ryl.toml .copier-migration-ryl.toml
      fi
    version: v0.10.0
    when: "{{ _stage == 'before' }}"
  - command: |
      if [ -e .copier-migration-ryl.toml ]; then
        mv -b .copier-migration-ryl.toml .config/ryl.toml
      fi
    version: v0.10.0
    when: "{{ _stage == 'after' }}"
  - command: |
      if [ -e typos.toml ]; then
        mv -b typos.toml .typos.toml
      fi
    version: v0.11.0
    when: "{{ _stage == 'before' }}"
  - command: |
      set -e
      mkdir -p .config
      if [ -e .jscpd.json ]; then mv -b .jscpd.json .config/jscpd.json; fi
      if [ -e .treefmt.toml ]; then mv -b .treefmt.toml .config/treefmt.toml; fi
    version: v0.12.0
    when: "{{ _stage == 'before' }}"
  - command: rm -f .github/workflows/cocogitto.yml
    version: v0.12.0
    when: "{{ _stage == 'after' }}"
  - command: rm -f apm.yml apm.lock.yaml
    version: v0.13.0
  - command: |
      if [ ! -e .oxfmtrc.json ]; then
        mise exec oxfmt -- oxfmt --migrate=prettier
      fi
    version: v0.16.0
    when: "{{ _stage == 'before' }}"
  - command: |
      if [ -e .oxfmtrc.json ]; then
        mv -b .oxfmtrc.json .copier-migration-oxfmt.json
      fi
    version: v0.16.0
    when: "{{ _stage == 'before' }}"
  - command: |
      if [ -e .copier-migration-oxfmt.json ]; then
        mv -b .copier-migration-oxfmt.json .oxfmtrc.json
      fi
    version: v0.16.0
    when: "{{ _stage == 'after' }}"
  - command: |
      if [ -e mise.toml ]; then
        mv -b mise.toml .copier-migration-mise.toml
      fi
    version: v0.24.0
    when: "{{ _stage == 'before' }}"
  - command: |
      if [ -e .copier-migration-mise.toml ]; then
        mkdir -p .config/mise
        mv -b .copier-migration-mise.toml .config/mise/config.toml
        rm -fr .mise/locks
        rm -f mise.lock
      fi
    version: v0.24.0
    when: "{{ _stage == 'after' }}"
_min_copier_version: 9.3.0
_subdirectory: template
_tasks:
  - command: command -v mise > /dev/null 2>&1 && echo "✓ mise is installed" || echo "✗ mise not found! Please install from here - https://mise.jdx.dev/"
    when: "{{ _copier_operation == 'copy' }}"
  - command: uvx --from lic-cli lic
    when: "{{ _copier_operation == 'copy' }}"
  - command: mise generate install-script --localize --write
    when: "{{ ci != 'github' }}"
ci:
  choices:
    Forgejo CI: forgejo
    GitHub CI: github
    GitLab CI: gitlab
  default: github
  help: What Continuous Integration service do you want to use?
  type: str
project_name:
  help: Enter the name of your project.
  type: str
  validator: "{% if not project_name %} project_name must not be empty. {% elif not (project_name | regex_search('^[a-zA-Z][a-zA-Z0-9 ._-]*$')) %} project_name must start with a letter and contain only letters, digits, spaces, dots, hyphens, or underscores. {% endif %}"
use_ai:
  default: false
  help: Include Capa-managed agent instructions and skills?
  type: bool
use_taste_skill:
  default: false
  help: Use taste-skill?
  type: bool
  when: "{{ use_ai }}"
