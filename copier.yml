---
_exclude:
  - "*.py[co]"
  - "{% if ci != 'github' %}.github{% endif %}"
  - "{% if ci != 'gitlab' %}.gitlab-ci.yml{% endif %}"
  - "{% if not use_agents %}AGENTS.md{% endif %}"
  - "{% if not use_agents %}CLAUDE.md{% endif %}"
  - "{% if not use_skills %}.agents/skills{% endif %}"
  - "{% if not use_skills %}apm.yml{% endif %}"
  - .DS_Store
  - .git
  - .pre-commit-config-copier.yaml
  - .svn
  - __pycache__
  - copier.yaml
  - copier.yml
  - megalinter-reports
  - ~*
_migrations:
  - command: mv -b .github/workflows/treefmt.yml .github/workflows/mise-check.yml
    version: v0.4.1
  - command: |
      mkdir -p .config
      mv -b cliff.toml .config/cliff.toml
      mv -b .cspell.json .config/cspell.json
      mv -b hk.pkl .config/hk.pkl
      mv -b .rumdl.toml .config/rumdl.toml
      mv -b .ryl.toml .config/ryl.toml
    version: v0.10.0
  - command: mv -b typos.toml .typos.toml
    version: v0.11.0
  - command: |
      mkdir -p .config
      mv -b .jscpd.json .config/jscpd.json
      mv -b .treefmt.toml .config/treefmt.toml
      rm -f  .github/workflows/cocogitto.yml
    version: v0.12.0
_min_copier_version: 9.3.0
_subdirectory: template
_tasks:
  - command: command -v mise > /dev/null 2>&1 && echo "✓ mise is installed" || echo "✗ mise not found! Please install from here - https://mise.jdx.dev/"
    when: "{{ _copier_operation == 'copy' }}"
  - command: uvx --from lic-cli lic
    when: "{{ _copier_operation == 'copy' }}"
ci:
  choices:
    GitHub CI: github
    GitLab CI: gitlab
  default: github
  help: What Continuous Integration service do you want to use?
  type: str
project_name:
  help: Enter the name of your project.
  type: str
  validator: "{% if not project_name %} project_name must not be empty. {% elif not (project_name | regex_search('^[a-zA-Z][a-zA-Z0-9 ._-]*$')) %} project_name must start with a letter and contain only letters, digits, spaces, dots, hyphens, or underscores. {% endif %}"
use_agents:
  default: false
  help: Use AGENTS.md?
  type: bool
use_skills:
  default: false
  help: Use skills?
  type: bool
use_taste_skill:
  default: false
  help: Use taste-skill?
  type: bool
