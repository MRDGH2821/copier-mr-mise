---
jobs:
  update-tools:
    name: Update mise tools
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
          install: false
      - name: Configure git identity for hooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve GitLab CLI pin
        run: echo "COPIER_TEMPLATE_GLAB_VERSION=$(mise latest glab)" >> "$GITHUB_ENV"
      - name: Resolve Forgejo CLI pin
        run: echo "COPIER_TEMPLATE_FORGEJO_CLI_VERSION=$(mise latest 'forgejo:forgejo-contrib/forgejo-cli')" >> "$GITHUB_ENV"
      - name: Upgrade pinned tools
        run: mise upgrade --bump --yes --no-prune --exclude pipx:lorenzwalthert/gitignore-tidy
      - name: Sync Copier template pins
        run: bun run .github/scripts/sync-mise-template.ts
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |-
            mise.toml
            mise.lock
            template/mise.toml.jinja
          body: Scheduled update of the mise tool pins and lockfile.
          branch: automation/mise-tool-updates
          commit-message: "build(mise): update tool versions"
          delete-branch: true
          title: "build(mise): update tool versions"
          token: ${{ secrets.GITHUB_TOKEN }}
name: Mise Tool Updates
on: # yamllint disable-line rule:truthy
  schedule:
    - cron: 0 9 * * *
  workflow_dispatch:
permissions: {}
