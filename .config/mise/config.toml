[deps.bun]
auto = true

[deps.capabilities]
auto = true
description = "Install Agent plugins"
# tombi: format.rules.array-values-order = "ascending"
outputs = [
  ".agents/skills/",
  ".claude/",
  ".codex/",
  ".cursor/",
  ".kiro/",
  ".mcp.json",
  "capabilities.lock"
]
run = "capa install --yes"
# tombi: format.rules.array-values-order = "ascending"
sources = [
  ".config/capabilities/",
  "capabilities.yaml",
  "template/.config/capabilities/"
]

[env]
HK_MISE = 1

[hooks]
# Automatically install/update git hooks when tools are installed.
# Then reconcile agent capabilities — capa is installed as a mise tool, so it
# is guaranteed present by the time postinstall runs.
postinstall = ["hk install --mise", { task = "ai-setup" }]

[settings]
experimental = true
lockfile = true
lockfile_auto_prune = true

[settings.github]
use_git_credentials = true

[tasks]
ai-setup = "capa install --yes"
check = ["hk check --all", "cog check"]
prepare-ci = ["bun ci"]

[tasks.format]
alias = "fmt"
run = ["hk fix --all"]

[tasks.prepare]
interactive = true
run = ["bun install", { task = "ai-setup" }]

[tools]
"aqua:google/keep-sorted" = "0.11.0"
"aqua:owenlamont/ryl" = "0.30.0"
betterleaks = "1.10.1"
bun = "1.4.5"
cocogitto = "7.0.0"
cspell = "10.5.2"
editorconfig-checker = "4.0.2"
gh = "2.105.0"
git-cliff = "2.14.2"
"github:MRDGH2821/Sort-Markdown-Tables" = "0.6.0"
"github:infragate/capa" = "2.4.0"
hk = { version = "2.13.0", workflow = "release.yml" }
ls-lint = "2.3.2"
pkl = "0.33.1"
"pypi:lorenzwalthert/gitignore-tidy" = "latest"
"pypi:toml-sort" = "0.26.0"
python = "latest"
rumdl = "0.3.5"
tombi = "1.11.3"
typos = "1.52.2"
uv = "0.13.9"
yq = "4.54.3"
