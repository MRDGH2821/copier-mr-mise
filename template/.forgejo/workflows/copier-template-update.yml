---
jobs:
  issue:
    if: needs.preview.outputs.update_available == 'true'
    name: Open or refresh update issue
    needs: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}
      - uses: https://github.com/jdx/mise-action
        with:
          cache: true
          install: false
      - name: Install Forgejo CLI
        run: mise install forgejo:forgejo-contrib/forgejo-cli
      - env:
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
        name: Authenticate Forgejo CLI
        run: printf '%s' "$FORGEJO_TOKEN" | mise exec forgejo:forgejo-contrib/forgejo-cli -- fj --host "$FORGEJO_SERVER_URL" auth add-token
      - uses: actions/download-artifact
        with:
          name: copier-update-preview
          path: ${{ runner.temp }}/copier-update-preview
      - env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
        name: Open or refresh issue
        run: |-
          set -euo pipefail
          title="Copier template update available"
          preview="${RUNNER_TEMP}/copier-update-preview/preview.md"
          issue=$(
            ISSUE_TITLE="${title}" node --input-type=module <<'NODE'
          const apiUrl = process.env.FORGEJO_API_URL.replace(/\/+$/, "");
          const url = new URL(
            `${apiUrl}/repos/${process.env.FORGEJO_REPOSITORY}/issues`,
          );
          url.searchParams.set("state", "open");
          url.searchParams.set("type", "issues");
          url.searchParams.set("q", process.env.ISSUE_TITLE);
          url.searchParams.set("limit", "100");
          const response = await fetch(url, {
            headers: { Authorization: `token ${process.env.FORGEJO_TOKEN}` },
          });
          if (!response.ok) {
            throw new Error(`Forgejo issue search failed: ${response.status}`);
          }
          const issues = await response.json();
          const issue = issues.find(
            ({ title, pull_request }) =>
              title === process.env.ISSUE_TITLE && !pull_request,
          );
          if (issue) console.log(issue.number);
          NODE
          )
          if [[ -n "${issue}" ]]; then
            body=$(cat "${preview}")
            mise exec forgejo:forgejo-contrib/forgejo-cli -- fj --host "${FORGEJO_SERVER_URL}" issue edit "${FORGEJO_REPOSITORY}#${issue}" body "${body}"
          else
            mise exec forgejo:forgejo-contrib/forgejo-cli -- fj --host "${FORGEJO_SERVER_URL}" issue create "${title}" --repo "${FORGEJO_REPOSITORY}" --no-template --body-file "${preview}"
          fi
  preview:
    name: Preview Copier update
    outputs:
      update_available: ${{ steps.preview.outputs.update_available }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}
      - uses: https://github.com/jdx/mise-action
        with:
          cache: false
          install: false
      - id: preview
        name: Preview the latest template
        run: |
          set -euo pipefail
          preview_dir="${RUNNER_TEMP}/copier-preview"
          git worktree add --detach "${preview_dir}" "${FORGEJO_SHA}"
          cd "${preview_dir}"
          mise install uv
          mise exec uv -- uvx --from copier copier update --defaults --skip-tasks --trust
          git add -N -A
          if git diff --quiet "${FORGEJO_SHA}" --; then
            echo "update_available=false" >> "${FORGEJO_OUTPUT}"
            exit 0
          fi
          patch="${RUNNER_TEMP}/copier-update.patch"
          git diff --no-ext-diff --unified=3 "${FORGEJO_SHA}" -- > "${patch}"
          patch_size=$(wc -c < "${patch}")
          {
            echo "The latest Copier template would change this generated project."
            echo
            echo "## Changed files"
            git diff --stat "${FORGEJO_SHA}"
            echo
            echo "## Potential changes"
            echo '```diff'
            if [[ "${patch_size}" -gt 45000 ]]; then
              head -c 45000 "${patch}"
              echo
              echo "[Diff truncated at 45 KB.]"
            else
              cat "${patch}"
            fi
            echo '```'
          } > "${RUNNER_TEMP}/copier-preview.md"
          echo "update_available=true" >> "${FORGEJO_OUTPUT}"
      - if: steps.preview.outputs.update_available == 'true'
        uses: actions/upload-artifact
        with:
          if-no-files-found: error
          name: copier-update-preview
          path: ${{ runner.temp }}/copier-preview.md
name: Copier Template Update
on: # yamllint disable-line rule:truthy
  schedule:
    - cron: 0 9 * * 1
  workflow_dispatch:
