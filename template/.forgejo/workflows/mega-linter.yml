---
concurrency:
  cancel-in-progress: true
  group: ${{ forgejo.ref }}-${{ forgejo.workflow_ref }}
# Comment env block if you do not want to apply fixes
env:
  # Apply linter fixes configuration
  #
  # When active, APPLY_FIXES must also be defined as environment variable
  # (in .forgejo/workflows/mega-linter.yml or another CI tool)
  APPLY_FIXES: all
  # Decide which event triggers application of fixes in a commit or a PR
  # (pull_request, push, all)
  APPLY_FIXES_EVENT: pull_request
  # If APPLY_FIXES is used, defines if the fixes are directly committed (commit)
  # or posted in a PR (pull_request)
  APPLY_FIXES_MODE: pull_request
jobs:
  megalinter:
    name: MegaLinter
    # Forgejo's automatic token has repository write access for same-repository PRs.
    runs-on: ubuntu-latest
    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          token: ${{ forgejo.token }}
      # MegaLinter
      # All available variables are described in documentation
      # https://megalinter.io/latest/config-file/
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment to use ApiReporter (Grafana)
          # API_REPORTER: true
          # API_REPORTER_URL: ${{ secrets.API_REPORTER_URL }}
          # API_REPORTER_BASIC_AUTH_USERNAME: ${{ secrets.API_REPORTER_BASIC_AUTH_USERNAME }}
          # API_REPORTER_BASIC_AUTH_PASSWORD: ${{ secrets.API_REPORTER_BASIC_AUTH_PASSWORD }}
          # API_REPORTER_METRICS_URL: ${{ secrets.API_REPORTER_METRICS_URL }}
          # API_REPORTER_METRICS_BASIC_AUTH_USERNAME: ${{ secrets.API_REPORTER_METRICS_BASIC_AUTH_USERNAME }}
          # API_REPORTER_METRICS_BASIC_AUTH_PASSWORD: ${{ secrets.API_REPORTER_METRICS_BASIC_AUTH_PASSWORD }}
          # API_REPORTER_DEBUG: false

          # ADD YOUR CUSTOM ENV VARIABLES HERE TO OVERRIDE VALUES OF
          # .mega-linter.yml AT THE ROOT OF YOUR REPOSITORY

          # Disable LLM Advisor for bot PRs (dependabot, renovate, etc.)
          LLM_ADVISOR_ENABLED: |-
            ${{
              forgejo.event_name != 'pull_request' ||
              (forgejo.event.pull_request.user.login != 'dependabot[bot]' &&
                forgejo.event.pull_request.user.login != 'renovate[bot]' &&
                forgejo.event.pull_request.user.login != 'github-actions[bot]' &&
                !startsWith(forgejo.event.pull_request.user.login, 'dependabot') &&
                !startsWith(forgejo.event.pull_request.user.login, 'renovate'))
            }}
          # Validates all source when push on main, else just the git diff with
          # main. Override with true if you always want to lint all sources
          #
          # To validate the entire codebase, set to:
          # VALIDATE_ALL_CODEBASE: true
          #
          # To validate only diff with main, set to:
          # VALIDATE_ALL_CODEBASE: >-
          #   ${{
          #     forgejo.event_name == 'push' &&
          #     forgejo.ref == 'refs/heads/main'
          #   }}
          VALIDATE_ALL_CODEBASE: true
        id: ml
        name: MegaLinter
        # You can override MegaLinter flavor used to have faster performances
        # More info at https://megalinter.io/latest/flavors/
        uses: https://github.com/oxsecurity/megalinter@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
      # Upload MegaLinter artifacts
      - if: success() || failure()
        name: Archive production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: "true"
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
      - env:
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
        if: |-
          (
            env.APPLY_FIXES_EVENT == 'all' ||
            env.APPLY_FIXES_EVENT == forgejo.event_name
          ) && env.APPLY_FIXES_MODE == 'pull_request' &&
          forgejo.event_name == 'pull_request' &&
          forgejo.event.pull_request.head.repo.full_name == forgejo.repository &&
          !startsWith(forgejo.head_ref, 'megalinter/fixes/')
        name: Authenticate Forgejo CLI
        run: printf '%s' "$FORGEJO_TOKEN" | mise exec forgejo:forgejo-contrib/forgejo-cli -- fj --host "$FORGEJO_SERVER_URL" auth add-token
      - env:
          FORGEJO_API_URL: ${{ forgejo.api_url }}
          FORGEJO_FIX_BRANCH: megalinter/fixes/${{ forgejo.event.pull_request.number }}
          FORGEJO_HEAD_REF: ${{ forgejo.head_ref }}
          FORGEJO_PR_NUMBER: ${{ forgejo.event.pull_request.number }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
        if: |-
          (
            env.APPLY_FIXES_EVENT == 'all' ||
            env.APPLY_FIXES_EVENT == forgejo.event_name
          ) && env.APPLY_FIXES_MODE == 'pull_request' &&
          forgejo.event_name == 'pull_request' &&
          forgejo.event.pull_request.head.repo.full_name == forgejo.repository &&
          !startsWith(forgejo.head_ref, 'megalinter/fixes/')
        name: Create or refresh pull request with fixes
        run: |-
          set -euo pipefail
          title="chore(megalinter): apply linters automatic fixes"
          body="Automated MegaLinter fixes for PR #${FORGEJO_PR_NUMBER}. Merge this pull request into ${FORGEJO_HEAD_REF} to apply them."
          find_pr() {
            node --input-type=module <<'NODE'
          const apiUrl = process.env.FORGEJO_API_URL.replace(/\/+$/, "");
          const repositoryParts = process.env.FORGEJO_REPOSITORY.split("/");
          const repository = repositoryParts.map(encodeURIComponent).join("/");
          const url = new URL(`${apiUrl}/repos/${repository}/pulls`);
          url.searchParams.set("state", "open");
          url.searchParams.set(
            "head",
            `${repositoryParts[0]}:${process.env.FORGEJO_FIX_BRANCH}`,
          );
          url.searchParams.set("base", process.env.FORGEJO_HEAD_REF);
          url.searchParams.set("limit", "100");
          const response = await fetch(url, {
            headers: { Authorization: `token ${process.env.FORGEJO_TOKEN}` },
          });
          if (!response.ok) {
            throw new Error(`Forgejo pull request search failed: ${response.status}`);
          }
          const pullRequests = await response.json();
          const pullRequest = pullRequests.find(
            ({ head, base }) =>
              head.ref === process.env.FORGEJO_FIX_BRANCH &&
              base.ref === process.env.FORGEJO_HEAD_REF,
          );
          if (pullRequest) {
            console.log(`${pullRequest.number}\t${pullRequest.html_url}`);
          }
          NODE
          }
          git switch -c "${FORGEJO_FIX_BRANCH}"
          git add -A
          pull_request="$(find_pr)"
          if git diff --cached --quiet; then
            if [[ -n "${pull_request}" ]]; then
              IFS=$'\t' read -r pr_number _ <<< "${pull_request}"
              mise exec forgejo:forgejo-contrib/forgejo-cli -- fj --host "$FORGEJO_SERVER_URL" pr close "${FORGEJO_REPOSITORY}#${pr_number}"
            fi
            exit 0
          fi
          git config user.name megalinter-bot
          git config user.email 129584137+megalinter-bot@users.noreply.github.com
          git commit -m "${title}"
          git push --force origin "HEAD:refs/heads/${FORGEJO_FIX_BRANCH}"
          pull_request="$(find_pr)"
          if [[ -n "${pull_request}" ]]; then
            IFS=$'\t' read -r pr_number pr_url <<< "${pull_request}"
            mise exec forgejo:forgejo-contrib/forgejo-cli -- fj --host "$FORGEJO_SERVER_URL" pr edit "${FORGEJO_REPOSITORY}#${pr_number}" title "$title"
            mise exec forgejo:forgejo-contrib/forgejo-cli -- fj --host "$FORGEJO_SERVER_URL" pr edit "${FORGEJO_REPOSITORY}#${pr_number}" body "$body"
          else
            mise exec forgejo:forgejo-contrib/forgejo-cli -- fj --host "$FORGEJO_SERVER_URL" pr create "$title" --repo "$FORGEJO_REPOSITORY" --head "$FORGEJO_FIX_BRANCH" --base "$FORGEJO_HEAD_REF" --body "$body"
            pull_request="$(find_pr)"
            if [[ -z "${pull_request}" ]]; then
              echo "Forgejo pull request was not found after creation." >&2
              exit 1
            fi
            IFS=$'\t' read -r pr_number pr_url <<< "${pull_request}"
          fi
          mise exec forgejo:forgejo-contrib/forgejo-cli -- fj --host "$FORGEJO_SERVER_URL" pr edit "${FORGEJO_REPOSITORY}#${pr_number}" labels --add bot
          echo "Pull Request #${pr_number} - ${pr_url}"
name: MegaLinter
# Trigger mega-linter at every push. Action will also be visible from
# Pull Requests to main
on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - master
  # Comment this line to trigger action only on pull-requests
  # (not recommended if you don't pay for GH Actions)
  push:
