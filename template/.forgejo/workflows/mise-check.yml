---
concurrency:
  cancel-in-progress: true
  group: ${{ github.ref }}-${{ github.workflow }}
jobs:
  mise-check:
    name: Mise Check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout
        with:
          persist-credentials: false
      - uses: https://github.com/jdx/mise-action
        with:
          cache: true
      - run: mise run prepare-ci
      - run: mise run check
name: Mise Check
on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - master
      - dev
  push:
permissions: {}
