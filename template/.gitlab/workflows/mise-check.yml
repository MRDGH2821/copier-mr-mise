---
mise-check:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates tar
  cache:
    key:
      files:
        - bin/mise
        - mise.toml
      prefix: mise-debian13-amd64
    paths:
      - .mise/installs/
      - .mise/cache/
  image: debian:13-slim
  script:
    - ./bin/mise install
    - ./bin/mise run prepare
    - ./bin/mise run check
