---
detect-arch:
  artifacts:
    reports:
      dotenv: arch.env
  image: debian@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad # debian:13-slim
  script:
    - |
      case "$(uname -m)" in
        x86_64) echo "MISE_ARCH=amd64" ;;
        aarch64 | arm64) echo "MISE_ARCH=arm64" ;;
        *) echo "MISE_ARCH=$(uname -m)" ;;
      esac > arch.env
mise-check:
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates tar
  cache:
    key:
      files:
        - bin/mise
        - .config/mise/config.toml
      prefix: mise-debian13-${MISE_ARCH}
    paths:
      - .mise/installs/
      - .mise/cache/
  image: debian@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad # debian:13-slim
  needs:
    - artifacts: true
      job: detect-arch
  script:
    - ./bin/mise install
    - ./bin/mise run prepare
    - ./bin/mise run check
