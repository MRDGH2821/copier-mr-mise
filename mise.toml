[env]
HK_MISE = 1

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = ["hk install --mise"]

[tasks]
ai-setup = "apm install"
check = ["treefmt --ci -vv && treefmt --ci"]
cspell = "cspell ."
fmt = "treefmt"
pre-commit = "hk run pre-commit"
prepare = ["bun install"]

[tools]
apm = { postinstall = "apm install", version = "latest" }
"aqua:numtide/treefmt" = "2.5.0"
bun = { postinstall = "bun install", version = "latest" }
cocogitto = "latest"
cspell = "latest"
git-cliff = "latest"
hk = "latest"
ls-lint = "latest"
"npm:sort-package-json" = "latest"
"pipx:yamlfix" = "latest"
pkl = "latest"
prettier = "latest"
rumdl = "latest"
tombi = "latest"
typos = "latest"
uv = "latest"
yamllint = "latest"
yq = "latest"

[[watch_files]]
patterns = ["apm.yml"]
task = "ai-setup"
